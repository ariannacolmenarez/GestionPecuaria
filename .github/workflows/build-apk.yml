name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: |
            cmdline-tools;latest
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Aceptar licencias de Android
        run: yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Instalar Dependencias
        run: npm ci

      - name: Compilar Proyecto Web
        run: npm run build

      - name: Sincronizar Capacitor con Android
        run: npx cap sync android

      - name: Dar Permisos a Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK Generado como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: GestionPecuaria-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
