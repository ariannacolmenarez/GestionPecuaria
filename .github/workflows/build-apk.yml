name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Generar APK de Gestion Pecuaria
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Dependencias
        run: npm ci

      - name: Compilar Proyecto Web
        run: npm run build

      - name: Sincronizar Capacitor con Android
        run: npx cap sync android

      - name: Dar Permisos a Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK Generado como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: GestionPecuaria-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
