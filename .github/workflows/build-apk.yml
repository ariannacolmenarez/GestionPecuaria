name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # Imagen fija para evitar cambios inesperados cuando ubuntu-latest migre de versión
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar Codigo
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      # Capacitor 8 + Android Gradle Plugin 8.13 requieren JDK 21
      - name: Configurar Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Instalar Android SDK 36 y aceptar licencias
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Instalar Dependencias
        run: npm ci

      - name: Verificar Tipos (TypeScript)
        run: npx tsc --noEmit -p .

      # vite escribe en app/src/main/assets/public (webDir de capacitor.config.ts)
      - name: Compilar Proyecto Web
        run: npm run build

      - name: Sincronizar Capacitor con Android
        run: npx cap sync android

      - name: Dar Permisos a Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APK Debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Subir APK Generado como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: GestionPecuaria-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
